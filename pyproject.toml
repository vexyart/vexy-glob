[project]
name = "vexy-glob"
dynamic = ["version"]
description = "Vexy Glob fast file finding"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Adam Twardoch", email = "adam+github@twardoch.com" },
]
keywords = ["filesystem", "find", "glob", "parallel", "rust", "search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Filesystems",
]
dependencies = [
  "fire>=0.7.0",
  "rich>=14.1.0",
]

[project.urls]
"Documentation" = "https://vexy.dev/vexy-glob/"
"Homepage" = "https://github.com/vexyart/vexy-glob"
"Repository" = "https://github.com/vexyart/vexy-glob"
"Issues" = "https://github.com/vexyart/vexy-glob/issues"

[project.scripts]
vg = "vexy_glob.__main__:main"

# Maturin builds the Rust extension and reads the package version from
# Cargo.toml (`dynamic = ["version"]` above). publish.sh writes the release
# version into Cargo.toml before tagging, so the tag and Cargo.toml agree.
[build-system]
requires = ["maturin>=1.9.2,<2"]
build-backend = "maturin"

[tool.cibuildwheel]
build = ["cp38-*", "cp39-*", "cp310-*", "cp311-*", "cp312-*"]
skip = ["*-musllinux_i686", "*-win32", "pp*"]
test-requires = "pytest"
test-command = "pytest {project}/tests -v"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-i686-image = "manylinux2014"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64", "universal2"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.hatch.envs.default]
dependencies = [
  "pytest>=8.3.5",
  "loguru>=0.7.3",
  "maturin>=1.9.2",
  "ruff>=0.1.0",
]

[tool.hatch.envs.default.scripts]
build = "maturin develop"
build-release = "maturin develop --release"
test = "pytest tests/ -v"
lint = "ruff check src/ vexy_glob/ tests/"
format = "ruff format src/ vexy_glob/ tests/"
check = "ruff check src/ vexy_glob/ tests/ && pytest tests/ -v"

[tool.hatch.envs.test]
template = "default"
matrix = [{ python = ["3.8", "3.9", "3.10", "3.11", "3.12"] }]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "vexy_glob._vexy_glob"
python-source = "."
strip = true
# Keep the sdist to what `cargo build` and the Python package need.
exclude = [
  { path = ".github/**/*", format = "sdist" },
  { path = "_github/**/*", format = "sdist" },
  { path = "docs/**/*", format = "sdist" },
  { path = "src_docs/**/*", format = "sdist" },
  { path = "scripts/**/*", format = "sdist" },
  { path = "examples/**/*", format = "sdist" },
  { path = "test_gitignore/**/*", format = "sdist" },
  { path = "benchmark_*.py", format = "sdist" },
  { path = "compare_with_fd_large.py", format = "sdist" },
  { path = "debug_*.py", format = "sdist" },
  { path = "diagnose_variance.py", format = "sdist" },
  { path = "isolate_content_issue.py", format = "sdist" },
  { path = "profile_*.py", format = "sdist" },
  { path = "sync_version.py", format = "sdist" },
  { path = "test_cold_start_fix.py", format = "sdist" },
  { path = "test_content_search_performance.py", format = "sdist" },
  { path = "test_large_scale.py", format = "sdist" },
  { path = "*.sh", format = "sdist" },
  { path = "*.txt", format = "sdist" },
  { path = "*.json", format = "sdist" },
  { path = "uv.lock", format = "sdist" },
  { path = ".cursorrules", format = "sdist" },
  { path = "AGENTS.md", format = "sdist" },
  { path = "CLAUDE.md", format = "sdist" },
  { path = "GEMINI.md", format = "sdist" },
  { path = "PLAN.md", format = "sdist" },
  { path = "TODO.md", format = "sdist" },
  { path = "WORK.md", format = "sdist" },
  { path = "*_ANALYSIS.md", format = "sdist" },
  { path = "PERFORMANCE_VS_TOOLS.md", format = "sdist" },
]

[tool.pytest.ini_options]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long (handled by formatter)

