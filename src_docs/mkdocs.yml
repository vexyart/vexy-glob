# this_file: src_docs/mkdocs.yml
site_name: vexy-glob
site_description: Fast file finding and content search for Python, built on the Rust crates behind fd and ripgrep
site_url: https://vexy.dev/vexy-glob/
repo_url: https://github.com/vexyart/vexy-glob
repo_name: vexyart/vexy-glob
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - search
nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - User guide:
      - Patterns and case: patterns.md
      - Filters: filters.md
      - Content search: content-search.md
      - Command line: cli.md
  - Reference:
      - Python API: api.md
      - Architecture: architecture.md
      - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
